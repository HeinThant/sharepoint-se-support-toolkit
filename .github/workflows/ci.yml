name: PowerShell QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Run-Tests.ps1
      - name: Test PowerShell 7
        shell: pwsh
        run: ./tests/Run-Tests.ps1
      - name: Build synthetic demo report
        shell: pwsh
        run: |
          & ./Invoke-SESupport.ps1 -Demo -OutputDirectory ./reports
          if ($LASTEXITCODE -ne 1) { throw 'Demo should report findings and exit 1.' }
          exit 0
      - name: Upload synthetic report
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: reports/
          retention-days: 7
